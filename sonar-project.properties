# borg-memory sidecar ships only src/ + scripts/. The full repo (demo React app,
# simulator, and *.test.ts files) is ~973 files and OOMs the 2 GB SonarQube scanner
# during JS taint analysis (JsSecuritySensor, ~20k UCFGs). Scope the scan to the
# code that is actually built into the deployed sidecar.
sonar.sources=src,scripts
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**
