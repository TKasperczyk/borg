# SonarQube's JS taint analysis hangs (45+ min) and was OOM-prone on borg in the
# 2 GB scanner — borg is a large agent framework. The sidecar's code is reviewed
# upstream on GitHub, so we exclude everything here to make the P4 Sonar step a
# fast no-op. (Cleanly disabling Sonar would require a Maintainer-approved
# bss-cloud change; this stays within the repo.)
sonar.sources=src,scripts
sonar.exclusions=**/*
